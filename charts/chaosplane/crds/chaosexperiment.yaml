apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: chaosexperiments.chaos.chaosplane.dev
  labels:
    app.kubernetes.io/part-of: chaosplane
spec:
  group: chaos.chaosplane.dev
  names:
    kind: ChaosExperiment
    listKind: ChaosExperimentList
    plural: chaosexperiments
    singular: chaosexperiment
    shortNames:
      - ce
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Target
          type: string
          jsonPath: .spec.target.kind
        - name: Action
          type: string
          jsonPath: .spec.action.type
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - target
                - action
                - duration
              properties:
                target:
                  type: object
                  required:
                    - kind
                  properties:
                    kind:
                      type: string
                    namespace:
                      type: string
                    labelSelector:
                      type: object
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                        matchExpressions:
                          type: array
                          items:
                            type: object
                            required:
                              - key
                              - operator
                            properties:
                              key:
                                type: string
                              operator:
                                type: string
                              values:
                                type: array
                                items:
                                  type: string
                    names:
                      type: array
                      items:
                        type: string
                action:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      type: string
                    parameters:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    duration:
                      type: string
                duration:
                  type: string
                rollback:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    timeout:
                      type: string
                execution:
                  type: object
                  properties:
                    parallelism:
                      type: integer
                      format: int32
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Completed
                    - Failed
                    - Aborted
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
